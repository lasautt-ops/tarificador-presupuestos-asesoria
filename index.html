function uid() { return Math.random().toString(36).slice(2, 9); }
function eur(n) { return (Number.isFinite(n) ? n : 0).toLocaleString("es-ES", { style: "currency", currency: "EUR" }); }
function todayDMY() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}

async function generarPDF(nombreArchivo = "propuesta") {
  const hojas = document.querySelectorAll("#right-scroll .hoja");
  if (!hojas.length) return;

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const anchoPDF = 210;
  const altoPDF = 297;

  for (let i = 0; i < hojas.length; i++) {
    const hoja = hojas[i];
    const canvas = await window.html2canvas(hoja, {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff",
    });
    const imgData = canvas.toDataURL("image/jpeg", 0.95);
    const altoImagen = (canvas.height * anchoPDF) / canvas.width;

    if (i > 0) pdf.addPage();
    pdf.addImage(imgData, "JPEG", 0, 0, anchoPDF, Math.min(altoImagen, altoPDF), undefined, "FAST");
  }

  pdf.save(`${nombreArchivo}.pdf`);
}

async function enviarPresupuestoAN8N(datos) {
  const webhookUrl = "https://n8n-n8n.vhtza8.easypanel.host/webhook/guardar-presupuesto";
  try {
    const respuesta = await fetch(webhookUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
    });
    return respuesta.ok;
  } catch (error) {
    console.error("Error de red al conectar con n8n:", error);
    return false;
  }
}

async function loginN8N(usuario, clave) {
  const url = "https://n8n-n8n.vhtza8.easypanel.host/webhook/login";
  try {
    const respuesta = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, clave }),
    });
    const datos = await respuesta.json().catch(() => null);
    const sesion = Array.isArray(datos) ? datos[0] : datos;

    if (!respuesta.ok || !sesion || !sesion.token) {
      return { ok: false, error: (sesion && sesion.error) || "Usuario o contraseña incorrectos" };
    }
    return { ok: true, sesion };
  } catch (error) {
    return { ok: false, error: "No se pudo conectar con el servidor" };
  }
}

const SESION_KEY = "lasautt_sesion";

function guardarSesion(sesion) {
  try {
    window.localStorage?.setItem(SESION_KEY, JSON.stringify(sesion));
  } catch {}
}
function leerSesion() {
  try {
    const raw = window.localStorage?.getItem(SESION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}
function borrarSesion() {
  try {
    window.localStorage?.removeItem(SESION_KEY);
  } catch {}
}

function formatFecha(f) {
  if (!f) return "";
  const d = new Date(f);
  if (isNaN(d.getTime())) return f;
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}

const LS_KEY = "lasautt_contratos_clientes";

function leerRegistros() {
  try {
    return JSON.parse(window.localStorage?.getItem(LS_KEY) || "[]") || [];
  } catch {
    return [];
  }
}
function guardarRegistro(reg) {
  const registros = leerRegistros();
  const nuevo = [{ id: uid(), fecha: todayDMY(), ...reg }, ...registros].slice(0, 200);
  try {
    window.localStorage?.setItem(LS_KEY, JSON.stringify(nuevo));
  } catch {}
  return nuevo;
}
function eliminarRegistro(id) {
  const registros = leerRegistros().filter((r) => r.id !== id);
  try {
    window.localStorage?.setItem(LS_KEY, JSON.stringify(registros));
  } catch {}
  return registros;
}

    if (d.cliente) setCliente(d.cliente);
    if (d.contrato) setContrato(d.contrato);
    if (d.servExtra) setServExtra(d.servExtra);

// ---------- Base de datos de clientes ----------

function exportarExcel(registros) {
  const filas = registros.map((r) => ({
    "Nombre": r.nombre || "",
    "CIF": r.cif || "",
    "Oficina": r.oficina || "",
    "Fecha": formatFecha(r.fecha),
    "Modelo de presupuesto": r.modelo || "",
    "Total (€)": Number(r.total) || 0,
  }));
  const hoja = XLSX.utils.json_to_sheet(filas);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Presupuestos");
  const fechaArchivo = todayDMY().replace(/\//g, "-");
  XLSX.writeFile(libro, `presupuestos_${fechaArchivo}.xlsx`);
}

function ClientesScreen({ onAbrirPresupuesto, sesion }) {
  const [registros, setRegistros] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [busqueda, setBusqueda] = useState("");
  const [expandido, setExpandido] = useState(null);
  const [filtroOficina, setFiltroOficina] = useState("");

  useEffect(() => {
    consultarPresupuestosN8N(sesion?.token).then((datos) => {
      setRegistros(Array.isArray(datos) ? datos : []);
      setCargando(false);
    });
  }, []);

  function eliminar(id) {
    setRegistros((prev) => prev.filter((r) => r.id !== id));
  }

const grupos = {};
  registros.forEach((r) => {
    const key = (r.cif && r.cif.trim()) || (r.empresa && r.empresa.trim()) || r.nombre || "Sin nombre";
    if (!grupos[key]) grupos[key] = { key, nombre: r.nombre, empresa: r.empresa, cif: r.cif, oficina: r.oficina, registros: [] };
    grupos[key].registros.push(r);
  });

  const oficinasDisponibles = [...new Set(registros.map((r) => r.oficina).filter(Boolean))].sort();
const listaGrupos = Object.values(grupos).filter((g) => {
    const q = busqueda.trim().toLowerCase();
    const pasaBusqueda = !q || (g.nombre || "").toLowerCase().includes(q) || (g.empresa || "").toLowerCase().includes(q) || (g.cif || "").toLowerCase().includes(q);
    const pasaOficina = !filtroOficina || g.oficina === filtroOficina;
    return pasaBusqueda && pasaOficina;
  });
  const totalGeneral = registros.reduce((s, r) => s + (Number(r.total) || 0), 0);

  return (
    <div style={{ maxWidth: 1100, margin: "0 auto", padding: "171px 28px", height: "100vh", overflowY: "auto" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12, paddingTop: 15, paddingBottom: 15 }}>
        <div>
          <div style={{ fontSize: 19, fontWeight: 700, color: NAVY }}>Base de datos de clientes</div>
          <div style={{ fontSize: 12.5, color: MUTE, marginTop: 3 }}>
            {listaGrupos.length} cliente{listaGrupos.length !== 1 ? "s" : ""} &middot; {registros.length} presupuesto{registros.length !== 1 ? "s" : ""} guardado{registros.length !== 1 ? "s" : ""} &middot; {eur(totalGeneral)} en total
          </div>
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <button
            onClick={() => exportarExcel(listaGrupos.flatMap((g) => g.registros))}
            style={btn(GREEN, "#fff")}
          >
            <FileText size={14} /> Exportar a Excel
          </button>
<div style={{ minWidth: 190 }}>
          <select
            value={filtroOficina}
            onChange={(e) => setFiltroOficina(e.target.value)}
            style={{ width: "100%", fontSize: 13.5, padding: "9px 11px", borderRadius: 8, border: `1px solid ${HAIR}`, backgroundColor: "#fff", outline: "none", color: NAVY }}
          >
            <option value="">Todas las oficinas</option>
            {oficinasDisponibles.map((of) => (
              <option key={of} value={of}>{of}</option>
            ))}
          </select>
        </div>
        </div>
      </div>

      {cargando ? (
        <div style={{ backgroundColor: "#fff", border: `1px solid ${HAIR}`, borderRadius: 14, padding: 40, textAlign: "center", color: MUTE, fontSize: 13.5 }}>
          Cargando presupuestos...
        </div>
      ) : listaGrupos.length === 0 ? (
        <div style={{ backgroundColor: "#fff", border: `1px solid ${HAIR}`, borderRadius: 14, padding: 40, textAlign: "center", color: MUTE, fontSize: 13.5 }}>
          Todavía no hay clientes guardados. Ve a cualquier plantilla, rellena los datos y pulsa "Guardar en base de datos".
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {listaGrupos.map((g) => {
            const abierto = expandido === g.key;
            const totalCliente = g.registros.reduce((s, r) => s + (Number(r.total) || 0), 0);
            return (
              <div key={g.key} style={{ backgroundColor: "#fff", border: `1px solid ${HAIR}`, borderRadius: 14, overflow: "hidden" }}>
                <button
                  onClick={() => setExpandido(abierto ? null : g.key)}
                  style={{ width: "100%", textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}
                >
                  <div>
                    <div style={{ fontSize: 14.5, fontWeight: 700, color: NAVY }}>{g.nombre || g.empresa || "Cliente sin nombre"}</div>
                    <div style={{ fontSize: 11.5, color: STEEL, marginTop: 3 }}>
                      {g.empresa ? `${g.empresa} \u00b7 ` : ""}{g.cif || "Sin CIF"}
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 10.5, color: MUTE, fontWeight: 600, textTransform: "uppercase" }}>
                        {g.registros.length} presupuesto{g.registros.length !== 1 ? "s" : ""}
                      </div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: GREEN }}>{eur(totalCliente)}</div>
                    </div>
                    <ChevronDown size={16} color={MUTE} style={{ transform: abierto ? "rotate(180deg)" : "none", transition: "transform 0.15s" }} />
                  </div>
                </button>
                {abierto && (
                  <div style={{ borderTop: `1px solid ${HAIR}`, padding: "8px 20px 16px" }}>
                    {g.registros.map((r) => (
                      <div key={r.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${HAIR}` }}>
                        <div>
                          <div style={{ fontSize: 12.5, fontWeight: 600, color: NAVY }}>{r.modelo}</div>
                          <div style={{ fontSize: 11, color: MUTE, marginTop: 2 }}>{formatFecha(r.fecha)}</div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                          <span style={{ fontSize: 13, fontWeight: 700, color: NAVY }}>{eur(Number(r.total) || 0)}</span>
                          <button
                            onClick={() => onAbrirPresupuesto(r.modelo_id, r.datos_completos)}
                            style={{ ...btn("#fff", NAVY, HAIR), padding: "5px 10px", fontSize: 11.5 }}
                          >
                            Recuperar
                          </button>
                          <button onClick={() => eliminar(r.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "#C0362C" }}>
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
