function uid() { return Math.random().toString(36).slice(2, 9); }
function eur(n) { return (Number.isFinite(n) ? n : 0).toLocaleString("es-ES", { style: "currency", currency: "EUR" }); }
function todayDMY() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}

async function generarPDF(nombreArchivo = "propuesta") {
  const hojas = document.querySelectorAll("#right-scroll .hoja");
  if (!hojas.length) return;

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const anchoPDF = 210;
  const altoPDF = 297;

  for (let i = 0; i < hojas.length; i++) {
    const hoja = hojas[i];
    const canvas = await window.html2canvas(hoja, {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff",
    });
    const imgData = canvas.toDataURL("image/jpeg", 0.95);
    const altoImagen = (canvas.height * anchoPDF) / canvas.width;

    if (i > 0) pdf.addPage();
    pdf.addImage(imgData, "JPEG", 0, 0, anchoPDF, Math.min(altoImagen, altoPDF), undefined, "FAST");
  }

  pdf.save(`${nombreArchivo}.pdf`);
}

async function actualizarEstadoPresupuestoN8N(token, id, estado) {
  const url = "https://n8n-n8n.vhtza8.easypanel.host/webhook/actualizar-estado-presupuesto";
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, id, estado }),
    });
    const datos = await r.json().catch(() => null);
    return r.ok && !datos?.error;
  } catch {
    return false;
  }
}

async function enviarPresupuestoAN8N(datos) {
  const webhookUrl = "https://n8n-n8n.vhtza8.easypanel.host/webhook/guardar-presupuesto";
  try {
    const respuesta = await fetch(webhookUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
    });
    return respuesta.ok;
  } catch (error) {
    console.error("Error de red al conectar con n8n:", error);
    return false;
  }
}

async function loginN8N(usuario, clave) {
  const url = "https://n8n-n8n.vhtza8.easypanel.host/webhook/login";
  try {
    const respuesta = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, clave }),
    });
    const datos = await respuesta.json().catch(() => null);
    const sesion = Array.isArray(datos) ? datos[0] : datos;

    if (!respuesta.ok || !sesion || !sesion.token) {
      return { ok: false, error: (sesion && sesion.error) || "Usuario o contraseña incorrectos" };
    }
    return { ok: true, sesion };
  } catch (error) {
    return { ok: false, error: "No se pudo conectar con el servidor" };
  }
}

function formatFecha(f) {
  if (!f) return "";
  const d = new Date(f);
  if (isNaN(d.getTime())) return f;
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}

const LS_KEY = "lasautt_contratos_clientes";

function leerRegistros() {
  try {
    return JSON.parse(window.localStorage?.getItem(LS_KEY) || "[]") || [];
  } catch {
    return [];
  }
}
function guardarRegistro(reg) {
  const registros = leerRegistros();
  const nuevo = [{ id: uid(), fecha: todayDMY(), ...reg }, ...registros].slice(0, 200);
  try {
    window.localStorage?.setItem(LS_KEY, JSON.stringify(nuevo));
  } catch {}
  return nuevo;
}
function eliminarRegistro(id) {
  const registros = leerRegistros().filter((r) => r.id !== id);
  try {
    window.localStorage?.setItem(LS_KEY, JSON.stringify(registros));
  } catch {}
  return registros;
}

function LoginScreen({ onLoginOk }) {
  const [usuario, setUsuario] = useState("");
  const [clave, setClave] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    if (!usuario || !clave) return;
    setError("");
    setCargando(true);
    const resultado = await loginN8N(usuario, clave);
    setCargando(false);
    if (resultado.ok) {
      guardarSesion(resultado.sesion);
      onLoginOk(resultado.sesion);
    } else {
      setError(resultado.error);
    }
  }

  return (
    <div style={{ minHeight: "100vh", backgroundColor: PAPER, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Inter', ui-sans-serif, system-ui, sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');`}</style>
      <form onSubmit={handleSubmit} style={{ backgroundColor: "#fff", border: `1px solid ${HAIR}`, borderRadius: 14, padding: 36, width: 340, boxShadow: "0 12px 32px rgba(0,37,61,0.08)" }}>

  style={{

    backgroundColor: RED,

    alignItems: "center",
    justifyContent: "center",
    marginBottom: 18,
    overflow: "hidden",
  }}
>

    src="./images/LOGO-CE-MENU.png"
    alt="CE Consulting"
    style={{
      width: 34,
      height: 34,
      objectFit: "contain",
    }}
  />
</div>

        <div style={{ fontSize: 12.5, color: MUTE, marginBottom: 22 }}>Introduce tu usuario y contraseña</div>

        <label style={{ fontSize: 11.5, fontWeight: 600, color: STEEL, marginBottom: 5, display: "block" }}>Usuario</label>
        <input

function renderVista(vista, label, datosRecuperados, limpiarRecuperados, abrirPresupuestoGuardado, sesion) {
  switch (vista) {

    case "auditoria":
      return <AuditoriaScreen sesion={sesion} />;
    case "historial":
    return <HistorialScreen sesion={sesion} />;  
    case "clientes":
      return <ClientesScreen onAbrirPresupuesto={abrirPresupuestoGuardado} sesion={sesion} />;
    case "autonomo-sin":
    case "sociedad-sin":
      return <PlantillaFiscalSimple label={label} modeloId={vista} datosRecuperados={datosRecuperados} limpiarRecuperados={limpiarRecuperados} sesion={sesion} />;
    case "autonomo-lab":
    case "sociedad-lab":
      return <PlantillaFiscalYLaboral label={label} modeloId={vista} datosRecuperados={datosRecuperados} limpiarRecuperados={limpiarRecuperados} sesion={sesion} />;
    case "sociedad-laboral":
      return <PlantillaSociedadLaboral label={label} modeloId={vista} datosRecuperados={datosRecuperados} limpiarRecuperados={limpiarRecuperados} sesion={sesion} />;
    case "zm-datos":
      return <PlantillaZmDatos label={label} modeloId={vista} datosRecuperados={datosRecuperados} limpiarRecuperados={limpiarRecuperados} sesion={sesion} />;
    default:
      return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", flexDirection: "column", gap: 10 }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: NAVY }}>{label}</div>
          <div style={{ fontSize: 13.5, color: MUTE }}>Próximamente.</div>
        </div>
      );
    case "encomienda-alsago":
  return <PlantillaEncomiendaAlsago label={label} modeloId={vista} datosRecuperados={datosRecuperados} limpiarRecuperados={limpiarRecuperados} sesion={sesion} />;
  
    case "presupuesto-alsago":
  return (
    <PlantillaPresupuestoAlsago
      label={label}
      modeloId={vista}
      datosRecuperados={datosRecuperados}
      limpiarRecuperados={limpiarRecuperados}
      sesion={sesion}
    />
  );    

    case "ficha-avanta":
  return (
    <PlantillaFichaAvanta
      label={label}
      modeloId={vista}
      datosRecuperados={datosRecuperados}
      limpiarRecuperados={limpiarRecuperados}
      sesion={sesion}
    />
  );
  }
}

  useEffect(() => {

    const d = datosRecuperados;
    if (d.cliente) setCliente(d.cliente);
    if (d.contrato) setContrato(d.contrato);
    if (d.serviciosExtra) setServiciosExtra(d.serviciosExtra);
    if (d.precioServicioFiscal !== undefined) setPrecioServicioFiscal(d.precioServicioFiscal);
    if (d.descuentoPct !== undefined) setDescuentoPct(d.descuentoPct);
    if (d.aplicarDescuento !== undefined) setAplicarDescuento(d.aplicarDescuento);
    if (d.cuotaAlta !== undefined) setCuotaAlta(d.cuotaAlta);
    if (d.lineasExtra) setLineasExtra(d.lineasExtra);
    if (d.nombreFirmante !== undefined) setNombreFirmante(d.nombreFirmante);
    if (d.deudor) setDeudor(d.deudor);
    limpiarRecuperados();

function exportarExcel(registros) {
  const filas = registros.map((r) => ({
    "Nombre": r.nombre || "",
    "CIF": r.cif || "",
    "Oficina": r.oficina || "",
    "Fecha": formatFecha(r.fecha),
    "Modelo de presupuesto": r.modelo || "",
    "Total (€)": Number(r.total) || 0,
  }));
  const hoja = XLSX.utils.json_to_sheet(filas);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Presupuestos");
  const fechaArchivo = todayDMY().replace(/\//g, "-");
  XLSX.writeFile(libro, `presupuestos_${fechaArchivo}.xlsx`);
}

function PlantillaZmDatos({ label, modeloId, datosRecuperados, limpiarRecuperados, sesion }) {

  const [servicios, setServicios] = useState([
    { id: uid(), texto: "Servicios de consultoría para la adecuación o actualización a la normativa en Protección de Datos Personales (RGPD UE 2016/679) y LOPDGDD (03/2018)", unidades: "", precio: "", importe: "" },

  ]);

  const [guardadoOk, setGuardadoOk] = useState(false);

  useEffect(() => {
    if (!sesion?.token) return;
    misOficinasN8N(sesion.token).then(setOficinasDisponibles);
  }, [sesion]);

  useEffect(() => {
    if (!datosRecuperados) return;
    const d = datosRecuperados;

    if (d.servicios) setServicios(d.servicios);
    limpiarRecuperados();
  }, [datosRecuperados]);

  const setC = (k, v) => setClienteData((c) => ({ ...c, [k]: v }));

  function calcImporte(u, p) {
    const nu = parseFloat(String(u).replace(",", "."));
    const np = parseFloat(String(p).replace(",", "."));
    if (isFinite(nu) && isFinite(np)) return (nu * np).toFixed(2);
    return null;
  }

  function actualizarServicio(id, campo, valor) {
    setServicios((prev) => prev.map((s) => {
      if (s.id !== id) return s;
      const actualizado = { ...s, [campo]: valor };
      if (campo === "unidades" || campo === "precio") {
        const calc = calcImporte(actualizado.unidades, actualizado.precio);
        if (calc !== null) actualizado.importe = calc;
      }
      return actualizado;
    }));
  }

  function eliminarServicio(id) {
    setServicios((prev) => prev.filter((s) => s.id !== id));
  }

  function añadirServicio() {
    setServicios((prev) => [...prev, { id: uid(), texto: "", unidades: "", precio: "", importe: "" }]);
  }

        </div>

            onClick={() => {
              const resumen = { modelo: label, modeloId, nombre: clienteData.nombre || "Cliente sin nombre", empresa: null, cif: "", total, oficina: clienteData.oficina, creadoPor: sesion?.nombre_usuario };
              const datosCompletos = { clienteData, servicios };
              guardarRegistro(resumen);
              enviarPresupuestoAN8N({ ...resumen, datosCompletos }).then((ok) => {
                if (ok) {

                  setTimeout(() => setGuardadoOk(false), 2500);
                }

            style={btn("#fff", NAVY, HAIR)}
          >
            <Save size={14} /> Guardar en base de datos

            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 600, color: GREEN, backgroundColor: "#E8F5EC", padding: "8px 13px", borderRadius: 8 }}>

          <button

                await generarPDF(`propuesta-${(clienteData.nombre || "cliente").replace(/\s+/g, "_")}`);

  datosRecuperados,

}) {
  const [datos, setDatos] = useState({
    nombre: "",
    nif: "",
    representacionLegal: "",
    cif: "",
    sedeSocial: "",
    poblacion: "",
    provincia: "",

    fdo: "",
    oficina: "",
  });

  const [oficinasDisponibles, setOficinasDisponibles] = useState([]);
  const [generando, setGenerando] = useState(false);
  const [guardadoOk, setGuardadoOk] = useState(false);

  useEffect(() => {
    if (!sesion?.token) return;
    misOficinasN8N(sesion.token).then(setOficinasDisponibles);
  }, [sesion]);

  useEffect(() => {
    if (!datosRecuperados) return;

    const d = datosRecuperados.encomiendaAlsago || datosRecuperados;

    if (d) {
      setDatos((prev) => ({ ...prev, ...d }));
    }

    limpiarRecuperados();
  }, [datosRecuperados]);

  const setD = (k, v) => {
    setDatos((prev) => ({ ...prev, [k]: v }));
  };

  async function guardar() {
    const resumen = {
      modelo: label,
      modeloId,
      nombre: datos.nombre || "Cliente sin nombre",
      empresa: datos.representacionLegal || "",
      cif: datos.cif || "",
      total: 0,
      oficina: datos.oficina || "",
      creadoPor: sesion?.nombre_usuario,
    };

    const datosCompletos = {
      encomiendaAlsago: datos,
    };

    guardarRegistro(resumen);

    const ok = await enviarPresupuestoAN8N({
      ...resumen,
      datosCompletos,
    });

    if (ok) {
      setGuardadoOk(true);
      setTimeout(() => setGuardadoOk(false), 2500);
    }
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh" }}>

          backgroundColor: "#fff",

          justifyContent: "space-between",

          </div>
        </div>

        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

          <button
            onClick={guardar}
            style={btn("#fff", ALSAGO_AZUL, HAIR)}
          >
            <Save size={14} /> Guardar en base de datos
          </button>

          {guardadoOk && (
            <span
              style={{
                fontSize: 12.5,
                fontWeight: 600,
                color: GREEN,

function PlantillaPresupuestoAlsago({
  label,
  modeloId,
  datosRecuperados,
  limpiarRecuperados,
  sesion,
}) {
  const [datos, setDatos] = useState({
    empresa: "",
    cliente: "",
    fecha: "",
    oficina: "",
    objetivos: [""],
    contenidos: [""],
    lineas: [
      {
        id: uid(),
        denominacion: "",
        alumnos: "",
        precioUnitario: "",
      },
    ],
  });

  const [oficinasDisponibles, setOficinasDisponibles] = useState([]);
  const [guardadoOk, setGuardadoOk] = useState(false);
  const [generando, setGenerando] = useState(false);

  useEffect(() => {
    if (!sesion?.token) return;

    misOficinasN8N(sesion.token).then(
      setOficinasDisponibles
    );
  }, [sesion]);

  useEffect(() => {
    if (!datosRecuperados) return;

    const recuperados =
      datosRecuperados.presupuestoAlsago ||
      datosRecuperados;

    if (recuperados) {
      setDatos((prev) => ({
        ...prev,
        ...recuperados,
      }));
    }

    limpiarRecuperados();
  }, [datosRecuperados]);

  const setD = (campo, valor) => {
    setDatos((prev) => ({
      ...prev,
      [campo]: valor,
    }));
  };

  function añadirObjetivo() {
    setDatos((prev) => ({
      ...prev,
      objetivos: [...prev.objetivos, ""],
    }));
  }

  function cambiarObjetivo(index, valor) {
    setDatos((prev) => ({
      ...prev,
      objetivos: prev.objetivos.map((item, i) =>
        i === index ? valor : item
      ),
    }));
  }

  function eliminarObjetivo(index) {
    setDatos((prev) => ({
      ...prev,
      objetivos:
        prev.objetivos.length > 1
          ? prev.objetivos.filter(
              (_, i) => i !== index
            )
          : [""],
    }));
  }

  function añadirContenido() {
    setDatos((prev) => ({
      ...prev,
      contenidos: [...prev.contenidos, ""],
    }));
  }

  function cambiarContenido(index, valor) {
    setDatos((prev) => ({
      ...prev,
      contenidos: prev.contenidos.map(
        (item, i) =>
          i === index ? valor : item
      ),
    }));
  }

  function eliminarContenido(index) {
    setDatos((prev) => ({
      ...prev,
      contenidos:
        prev.contenidos.length > 1
          ? prev.contenidos.filter(
              (_, i) => i !== index
            )
          : [""],
    }));
  }

  function añadirLinea() {
    setDatos((prev) => ({
      ...prev,
      lineas: [
        ...prev.lineas,
        {
          id: uid(),
          denominacion: "",
          alumnos: "",
          precioUnitario: "",
        },
      ],
    }));
  }

  function cambiarLinea(id, campo, valor) {
    setDatos((prev) => ({
      ...prev,
      lineas: prev.lineas.map((linea) =>
        linea.id === id
          ? {
              ...linea,
              [campo]: valor,
            }
          : linea
      ),
    }));
  }

  function eliminarLinea(id) {
    setDatos((prev) => ({
      ...prev,
      lineas:
        prev.lineas.length > 1
          ? prev.lineas.filter(
              (linea) => linea.id !== id
            )
          : prev.lineas,
    }));
  }

  function numero(valor) {
    const n = parseFloat(
      String(valor ?? "").replace(",", ".")
    );

    return Number.isFinite(n) ? n : 0;
  }

  function importeLinea(linea) {
    return (
      numero(linea.alumnos) *
      numero(linea.precioUnitario)
    );
  }

  const importeTotal = datos.lineas.reduce(
    (total, linea) =>
      total + importeLinea(linea),
    0
  );

  const iva = importeTotal * 0.21;
  const total = importeTotal + iva;

  async function guardar() {
    const resumen = {
      modelo: label,
      modeloId,
      nombre:
        datos.cliente ||
        datos.empresa ||
        "Cliente sin nombre",
      empresa: datos.empresa || "",
      cif: "",
      total,
      oficina: datos.oficina || "",
      creadoPor: sesion?.nombre_usuario,
    };

    const datosCompletos = {
      presupuestoAlsago: datos,
    };

    guardarRegistro(resumen);

    const ok =
      await enviarPresupuestoAN8N({
        ...resumen,
        datosCompletos,
      });

    if (ok) {
      setGuardadoOk(true);

      setTimeout(
        () => setGuardadoOk(false),
        2500
      );
    }
  }

  return (
    <div
      style={{
        display: "flex",
        flexDirection: "column",
        height: "100vh",
      }}
    >
      {/* CABECERA */}
      <div
        className="no-print"
        style={{
          backgroundColor: "#fff",
          borderBottom: `1px solid ${HAIR}`,
          padding: "14px 24px",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
        }}
      >
        <div>
          <div
            style={{
              fontSize: 15.5,
              fontWeight: 700,
              color: NAVY,
            }}
          >
            {label}
          </div>

          <div
            style={{
              fontSize: 11.5,
              color: MUTE,
            }}
          >
            Rellena los datos a la izquierda —
            el presupuesto se genera a la derecha
          </div>
        </div>

        <div
          style={{
            display: "flex",
            gap: 8,
            alignItems: "center",
          }}
        >
          {guardadoOk && (
            <span
              style={{
                fontSize: 12,
                fontWeight: 600,

function PlantillaFichaAvanta({ label, modeloId, datosRecuperados, limpiarRecuperados, sesion }) {
  const [datos, setDatos] = useState({
    fechaPpt: todayDMY(),
    oficina: "",
    razonSocial: "",
    cif: "",
    domicilioSocial: "",
    codigoPostal: "",
    numTrabajadores: "",
    actividadCnae: "",
    centrosTrabajo: "",
    personaContacto: "",
    telefono: "",
    email: "",
    numContrato: "",
    representanteLegal: "",
    dni: "",
    cuentaBancaria: "",
    observaciones: "",
  });

  const [oficinasDisponibles, setOficinasDisponibles] = useState([]);
  const [guardadoOk, setGuardadoOk] = useState(false);
  const [generando, setGenerando] = useState(false);

  useEffect(() => {
    if (!sesion?.token) return;

    misOficinasN8N(sesion.token).then(setOficinasDisponibles);
  }, [sesion]);

  useEffect(() => {
    if (!datosRecuperados) return;

    const recuperados = datosRecuperados.fichaAvanta || datosRecuperados;

    if (recuperados) {
      setDatos((prev) => ({ ...prev, ...recuperados }));
    }

    limpiarRecuperados();
  }, [datosRecuperados]);

  const setD = (campo, valor) => {
    setDatos((prev) => ({ ...prev, [campo]: valor }));
  };

  async function guardar() {
    const resumen = {
      modelo: label,
      modeloId,
      nombre: datos.razonSocial || "Cliente sin nombre",
      empresa: datos.razonSocial || "",
      cif: datos.cif || "",
      total: 0,
      oficina: datos.oficina || "",
      creadoPor: sesion?.nombre_usuario,
    };

    const datosCompletos = {
      fichaAvanta: datos,
    };

    guardarRegistro(resumen);

    const ok = await enviarPresupuestoAN8N({ ...resumen, datosCompletos });

    if (ok) {
      setGuardadoOk(true);
      setTimeout(() => setGuardadoOk(false), 2500);
    }
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh" }}>
      {/* CABECERA */}
      <div className="no-print" style={{ backgroundColor: "#fff", borderBottom: `1px solid ${HAIR}`, padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div style={{ fontSize: 15.5, fontWeight: 700, color: NAVY }}>{label}</div>
          <div style={{ fontSize: 11.5, color: MUTE }}>Rellena los datos a la izquierda — la ficha se genera a la derecha</div>
        </div>

        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {guardadoOk && (
            <span style={{ fontSize: 12, fontWeight: 600, color: GREEN }}>✓ Guardado correctamente</span>
          )}

          <button onClick={guardar} style={btn("#fff", NAVY, HAIR)}>
            <Save size={14} />
            Guardar
          </button>

          <button
            onClick={async () => {
              setGenerando(true);
              try {
                await generarPDF(`ficha-avanta-${(datos.razonSocial || "cliente").replace(/\s+/g, "_")}`);
              } finally {
                setGenerando(false);
              }
            }}
            disabled={generando}
            style={btn(GREEN, "#fff")}
          >
            <Printer size={14} />
            {generando ? "Generando..." : "Descargar PDF"}
          </button>
        </div>
      </div>

  const [filtroEstado, setFiltroEstado] = useState("");
  const [filtroModelo, setFiltroModelo] = useState("");

  useEffect(() => {
    consultarPresupuestosN8N(sesion?.token).then((datos) => {
      setRegistros(Array.isArray(datos) ? datos : []);
      setCargando(false);
    });
  }, []);

  function eliminar(id) {
    setRegistros((prev) => prev.filter((r) => r.id !== id));
  }

const oficinasDisponibles = [
  ...new Set(
    registros
      .map((r) => r.oficina)
      .filter(Boolean)
  ),
].sort();

const modelosDisponibles = MODELOS
  .filter(
    (m) =>
      m.id !== "clientes" &&
      m.disponible !== false
  )
  .map((m) => ({
    id: m.id,
    label: m.label,
  }));

const registrosFiltrados = registros.filter((r) => {
  const modeloRegistro =
    r.modelo_id ||
    r.modeloId ||
    "";

  const pasaOficina =
    !filtroOficina ||
    r.oficina === filtroOficina;

  const pasaEstado = !filtroEstado || r.estado === filtroEstado;

  const texto = busqueda.trim().toLowerCase();
  const pasaBusqueda =
    !texto ||
    (r.empresa || "").toLowerCase().includes(texto) ||
    (r.cif || "").toLowerCase().includes(texto) ||
    (r.nombre || "").toLowerCase().includes(texto);


  const pasaModelo =
    !filtroModelo ||
    modeloRegistro === filtroModelo;

  return pasaOficina && pasaModelo && pasaEstado && pasaBusqueda;
});

const grupos = {};

registrosFiltrados.forEach((r) => {
  const key =
    (r.cif && r.cif.trim()) ||
    (r.empresa && r.empresa.trim()) ||
    r.nombre ||
    "Sin nombre";

  if (!grupos[key]) {
    grupos[key] = {
      key,
      nombre: r.nombre,
      empresa: r.empresa,
      cif: r.cif,
      oficina: r.oficina,
      registros: [],
    };
  }

  grupos[key].registros.push(r);
});
